name: Context tree

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Context tree gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snippets compile, links and anchors resolve, layout holds
        run: |
          python3 .agents/skills/verify-rules/scripts/verify_rule_docs.py .agents --group block --compiler clang++ --std c++17
          python3 .agents/skills/verify-rules/scripts/check_heading_numbering.py .agents/rules/style/naming.md -r .agents/rules
          python3 .agents/skills/verify-rules/scripts/check_context_layout.py --root .agents --repo .

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bazelisk
        run: |
          # /usr/local/bin is not writable by the runner user (curl exits 23);
          # install into ~/.local/bin and put it on PATH.
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o "$HOME/.local/bin/bazel" https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          chmod +x "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install doit
        run: python3 -m pip install --user doit
      - name: Build
        run: doit build
      - name: Test
        run: doit test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the documentation toolchain
        run: |
          # The same Asciidoctor.js pin as the development machine
          # (4.0.0 is broken on Node 22) — see .agents/rules/docs.md.
          npm install -g @asciidoctor/cli@3.5.0
          asciidoctor --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq plantuml doxygen
      - name: Install doit
        run: python3 -m pip install --user doit
      - name: Check the documentation tree
        run: doit docs_check
      - name: Build the documentation
        run: doit docs
      # Publishing to GitHub Pages is not wired yet — the site travels as an artifact.
      - name: Upload the built documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: build/docs
